android.useAndroidX=true

# Give the Gradle daemon enough heap for in-process Kotlin compilation.
# When the Kotlin compile daemon cannot run (e.g. its ~/Library/Application
# Support/kotlin/daemon working directory is unavailable), compilation falls
# back to the Gradle daemon's JVM, which needs a larger max heap.
org.gradle.jvmargs=-Xmx4g

# AGP 9.0+ no longer allows com.android.application together with the Kotlin
# Multiplatform plugin (there is no KMP replacement for com.android.application).
# These properties keep the legacy combination working for the sample app.
android.builtInKotlin=false
android.newDsl=false

# Publishing
GROUP=dev.boling.komotion
VERSION_NAME=0.4.1

