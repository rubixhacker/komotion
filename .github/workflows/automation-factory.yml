name: Automation Factory Dispatch

# Thin public event adapter. The factory implementation and runtime state live
# in a private repository; each lane reads current GitHub state after waking.
on:
  issues:
    types: [labeled]
  pull_request_target:
    branches: [main]
    types: [closed]
  push:
    branches: [main]
  workflow_run:
    workflows:
      - CI
    types: [completed]
    branches:
      - 'sandcastle/issue-*'
  workflow_dispatch:

permissions: {}

jobs:
  enqueue:
    if: >-
      github.repository == 'rubixhacker/komotion' &&
      (github.event_name != 'issues' ||
       github.event.label.name == 'ready-for-agent') &&
      (github.event_name != 'pull_request_target' ||
       (startsWith(github.event.pull_request.head.ref, 'sandcastle/issue-') &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, sandcastle-dispatch]
    timeout-minutes: 2
    steps:
      - name: Queue an event for the local issue factory
        shell: bash
        run: bash "${SANDCASTLE_RUNTIME_DIR:-$HOME/Workspace/komotion-factory}/scripts/ci/sandcastle-enqueue.sh" factory

  arm-merge:
    if: >-
      github.repository == 'rubixhacker/komotion' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'sandcastle/issue-') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, sandcastle-dispatch]
    timeout-minutes: 5
    steps:
      - name: Arm squash auto-merge for the green factory pull request
        shell: bash
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          runtime=${SANDCASTLE_RUNTIME_DIR:-$HOME/Workspace/komotion-factory}
          cd "$runtime/.sandcastle"
          pr=$(gh pr list --repo rubixhacker/komotion --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open factory pull request for $BRANCH; nothing to arm."
            exit 0
          fi
          npm run --silent arm-merge -- "$pr"

  ci-repair:
    if: >-
      github.repository == 'rubixhacker/komotion' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        startsWith(github.event.workflow_run.head_branch, 'sandcastle/issue-')) ||
       github.event_name == 'push')
    runs-on: [self-hosted, sandcastle-dispatch]
    timeout-minutes: 30
    steps:
      - name: Repair the failing or conflicting factory pull request
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: >-
          bash "${SANDCASTLE_RUNTIME_DIR:-$HOME/Workspace/komotion-factory}/scripts/ci/sandcastle-ci-repair.sh"
          "$EVENT_NAME" "$HEAD_BRANCH"
