name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run tests and compile all targets
    if: github.repository == 'rubixhacker/komotion'
    # macOS is the only runner that can compile the iOS targets. The image
    # also ships Xcode and a license-accepted Android SDK, so every target
    # in every module compiles here. The local delivery gate runs the same
    # command on its macOS host.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and compile all targets
        run: ./gradlew desktopTest compileAllTargets
