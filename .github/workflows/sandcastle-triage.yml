name: Sandcastle Triage Dispatch

# The triage lane has no polling timer. Wake it when a new issue arrives or a
# human asks for a pass; the lane reads current GitHub state itself.
on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions: {}

jobs:
  enqueue:
    runs-on: [self-hosted, sandcastle-dispatch]
    timeout-minutes: 2
    steps:
      - name: Queue an event for the triage lane
        shell: bash
        run: bash "${SANDCASTLE_RUNTIME_DIR:-$HOME/Workspace/komotion-factory}/scripts/ci/sandcastle-enqueue.sh" triage
